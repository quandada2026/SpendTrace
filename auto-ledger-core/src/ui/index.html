<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>自动记账 · 账本</title>
    <style>
      :root {
        --bg: #f5f6f8;
        --card: #ffffff;
        --line: #e6e8eb;
        --text: #1f2329;
        --muted: #8a9099;
        --red: #e54d42;
        --blue: #2f6fed;
        --warn: #ff9f0a;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: -apple-system, "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
        background: var(--bg);
        color: var(--text);
      }
      header {
        position: sticky; top: 0; z-index: 10;
        background: var(--card); border-bottom: 1px solid var(--line);
        padding: 14px 18px; display: flex; align-items: center; gap: 16px;
      }
      header h1 { font-size: 16px; margin: 0; }
      .summary { display: flex; gap: 18px; margin-left: auto; font-size: 13px; color: var(--muted); }
      .summary b { color: var(--text); font-size: 15px; }
      .toolbar { padding: 12px 18px; display: flex; gap: 10px; align-items: center; }
      button {
        border: 1px solid var(--line); background: var(--card); color: var(--text);
        padding: 7px 12px; border-radius: 8px; cursor: pointer; font-size: 13px;
      }
      button.primary { background: var(--blue); color: #fff; border-color: var(--blue); }
      input[type="file"] { display: none; }
      main { padding: 0 18px 40px; }
      .entry {
        background: var(--card); border: 1px solid var(--line); border-radius: 12px;
        padding: 12px 14px; margin-bottom: 10px; display: flex; align-items: center; gap: 12px;
      }
      .entry.review { border-color: var(--warn); box-shadow: 0 0 0 1px var(--warn) inset; }
      .amt { font-size: 18px; font-weight: 600; color: var(--red); min-width: 92px; text-align: right; }
      .meta { flex: 1; min-width: 0; }
      .merchant { font-size: 15px; font-weight: 500; }
      .sub { font-size: 12px; color: var(--muted); margin-top: 2px; }
      .tag {
        display: inline-block; font-size: 11px; padding: 1px 7px; border-radius: 999px;
        background: #eef2ff; color: var(--blue); margin-right: 6px;
      }
      .tag.warn { background: #fff3e0; color: var(--warn); }
      .acts { display: flex; gap: 6px; }
      .empty { text-align: center; color: var(--muted); padding: 40px; }
      dialog {
        border: none; border-radius: 14px; padding: 18px; width: 320px;
        box-shadow: 0 10px 40px rgba(0,0,0,.15);
      }
      dialog label { display: block; font-size: 12px; color: var(--muted); margin: 10px 0 4px; }
      dialog input, dialog select {
        width: 100%; padding: 8px; border: 1px solid var(--line); border-radius: 8px; font-size: 14px;
      }
      .dialog-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 16px; }
    </style>
  </head>
  <body>
    <header>
      <h1>自动记账 · 账本</h1>
      <div class="summary">
        <span>本月支出 <b id="monthTotal">¥0</b></span>
        <span>待核对 <b id="reviewCount">0</b></span>
      </div>
    </header>

    <div class="toolbar">
      <button class="primary" id="uploadBtn">＋ 手动上传截图</button>
      <input type="file" id="fileInput" accept="image/*" />
      <button id="refreshBtn">刷新</button>
      <span id="status" style="color:var(--muted);font-size:12px;"></span>
    </div>

    <main id="list"></main>

    <dialog id="editDialog">
      <h3 style="margin:0 0 4px;">修正账目</h3>
      <label>金额（元）</label>
      <input id="fAmount" type="number" step="0.01" />
      <label>商户</label>
      <input id="fMerchant" type="text" />
      <label>分类</label>
      <select id="fCategory">
        <option>餐饮</option><option>交通</option><option>购物</option>
        <option>居家</option><option>医疗</option><option>娱乐</option>
        <option>教育</option><option>人情</option><option>其他</option>
      </select>
      <label>时间</label>
      <input id="fTime" type="text" placeholder="YYYY-MM-DD HH:MM:SS" />
      <div class="dialog-actions">
        <button id="dlgDelete">删除</button>
        <button id="dlgCancel">取消</button>
        <button class="primary" id="dlgSave">保存</button>
      </div>
    </dialog>

    <script src="/app.js"></script>
  </body>
</html>
